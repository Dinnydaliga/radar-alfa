name: Teste manual Radar Alfa PNCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-pncp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir sintaxe
        run: |
          python -m py_compile scripts/pncp_piloto.py
          python -m unittest discover -s tests -v
      - name: Consultar PNCP
        run: python scripts/pncp_piloto.py --uf BR --paginas 2 --saida resultado-pncp.json --resumo resumo-pncp.md
      - name: Mostrar resumo no GitHub
        if: always()
        run: |
          if [ -f resumo-pncp.md ]; then
            cat resumo-pncp.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Radar Alfa — falha antes de gerar resumo' >> "$GITHUB_STEP_SUMMARY"
            echo 'Verifique os logs da execução; nenhuma contagem de licitações pode ser confirmada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Salvar resultado para analise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pncp-piloto
          path: resultado-pncp.json
          if-no-files-found: warn
          retention-days: 3
